<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="460" height="100" fill="none">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1c2024" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </radialGradient>

    <!-- Supabase Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ECF8E" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Cyan Pulse Accent -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3ECF8E" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- LOGO MARK (Left - 80x80 scaled inside 10,10) -->
  <g transform="translate(10, 10)">
    <!-- Squircle Base -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#bgGlow)" stroke="#262c33" stroke-width="1.5" />
    <rect x="1" y="1" width="78" height="78" rx="19" fill="none" stroke="white" stroke-opacity="0.06" stroke-width="1" />

    <!-- Ambient Radar Rings -->
    <circle cx="40" cy="40" r="26" stroke="#3ECF8E" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="2 2" />
    <circle cx="40" cy="40" r="16" stroke="#3ECF8E" stroke-opacity="0.16" stroke-width="1" />

    <!-- Database Platter Base -->
    <ellipse cx="40" cy="28" rx="20" ry="6" fill="#20242a" stroke="#3ECF8E" stroke-opacity="0.35" stroke-width="1.2" />
    <path d="M 20,40 A 20 6 0 0 0 60,40" fill="none" stroke="#2a323a" stroke-width="1.2" />
    <path d="M 20,52 A 20 6 0 0 0 60,52" fill="none" stroke="#222830" stroke-width="1.2" />
    <line x1="20" y1="28" x2="20" y2="52" stroke="#2a323a" stroke-width="1.2" />
    <line x1="60" y1="28" x2="60" y2="52" stroke="#2a323a" stroke-width="1.2" />

    <!-- Dynamic "S" Vector Wave -->
    <path d="M 52,22 
             C 45,18 30,20 28,27 
             C 26,34 35,36 42,38 
             C 50,40 54,45 51,51 
             C 48,58 32,60 26,55" 
          fill="none" 
          stroke="url(#emeraldGrad)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#emeraldGlow)" />

    <!-- Heartbeat Telemetry Pulse Spike -->
    <path d="M 26,40 L 34,40 L 38,29 L 43,49 L 47,40 L 54,40" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="1.8" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <circle cx="38" cy="29" r="1.5" fill="#38BDF8" />
    <circle cx="64" cy="18" r="3" fill="#3ECF8E" filter="url(#emeraldGlow)" />
  </g>

  <!-- TYPOGRAPHY (Right) -->
  <g transform="translate(108, 18)">
    <!-- Wordmark -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#F8FAFC">SUPABASE </tspan>
      <tspan fill="#3ECF8E">SNIFFER</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="1" y="52" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', monospace" font-size="10.5" font-weight="600" fill="#94A3B8" letter-spacing="3.2">
      DIAGNOSTIC &amp; HEALTH ENGINE
    </text>

    <!-- Meta Pill Badge -->
    <g transform="translate(265, 12)">
      <rect x="0" y="0" width="76" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="10" cy="11" r="3" fill="#10B981" />
      <text x="18" y="14.5" font-family="monospace" font-size="9" font-weight="700" fill="#E2E8F0">
        v1.0.0
      </text>
    </g>
  </g>
</svg>
